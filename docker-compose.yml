# Stack locale de développement pour voxlivre-api.
#
#   docker compose up -d              # démarrer postgres + redis + rustfs (S3) + dbgate
#   docker compose logs -f postgres   # suivre un service
#   docker compose down               # arrêt
#   docker compose down -v            # arrêt + suppression des volumes (reset)
#
# L'API tourne sur la machine hôte (`pnpm start:dev`, hot-reload), pas dans
# un conteneur : plus simple à déboguer, et Railway construit sa propre image
# depuis le Dockerfile. Ce fichier est strictement DX locale.

services:
  postgres:
    image: postgres:16-alpine
    container_name: voxlivre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voxlivre
      POSTGRES_PASSWORD: voxlivre_dev_password
      POSTGRES_DB: voxlivre
    ports:
      - '5433:5432' # 5433 côté hôte : 5432 est déjà pris par un Postgres natif
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voxlivre -d voxlivre']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: voxlivre-redis
    restart: unless-stopped
    ports:
      - '6380:6379' # idem, 6379 est déjà pris par un Redis natif
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    # Stockage objet S3-compatible local (ADR-0007) — remplace Cloudflare R2
    # en dev. RustFS plutôt que MinIO : les images MinIO ne sont plus
    # distribuées publiquement.
    # Console web : http://localhost:9003/rustfs/console/index.html
    image: rustfs/rustfs:1.0.1
    container_name: voxlivre-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: voxlivre_dev_access
      RUSTFS_SECRET_KEY: voxlivre_dev_secret_key
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9002:9000' # API S3 (9000 laissé libre pour d'autres stacks)
      - '9003:9001' # console
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs-init:
    # Crée le bucket de dev (idempotent : un bucket existant répond 200).
    # curl signe la requête en SigV4 lui-même, pas besoin d'un client S3.
    image: curlimages/curl:8.16.0
    container_name: voxlivre-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - curl
      - -fsS
      - -X
      - PUT
      - --aws-sigv4
      - aws:amz:us-east-1:s3
      - --user
      - voxlivre_dev_access:voxlivre_dev_secret_key
      - http://rustfs:9000/voxlivre-dev

  dbgate:
    # UI web pour explorer Postgres en dev : http://localhost:8081
    # (tables, éditeur SQL, diagrammes ER). Connexion pré-configurée.
    image: dbgate/dbgate:latest
    container_name: voxlivre-dbgate
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONNECTIONS: con1
      LABEL_con1: voxlivre-postgres
      SERVER_con1: postgres
      PORT_con1: 5432
      USER_con1: voxlivre
      PASSWORD_con1: voxlivre_dev_password
      DATABASE_con1: voxlivre
      ENGINE_con1: postgres@dbgate-plugin-postgres
    ports:
      - '8081:3000'
    volumes:
      - dbgate_data:/root/.dbgate

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
  dbgate_data:

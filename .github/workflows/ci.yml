# CI voxlivre-api — garde-fou serveur des règles d'AGENTS.md.
#
# Les hooks Husky (pre-commit / pre-push) vérifient la même chose en local,
# mais `--no-verify` les contourne : ici, rien ne se contourne. Sur `master`,
# le job Deploy publie puis déploie l'image une fois TOUS les contrôles
# passés (ADR-0012, étape 4 : OIDC → ECR → SSM ; infra/README.md).

name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: voxlivre-api-${{ github.ref }}
  # Une PR mise à jour annule son ancienne CI ; sur master, jamais (un
  # déploiement interrompu au milieu des migrations est le pire cas).
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4 # version lue dans `packageManager`
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc # même Node que `engines` (engine-strict)
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ESLint type-aware charge tout le programme TS : on relève le heap Node
      # (OOM rencontré chez cinaf-engine sur le plafond par défaut).
      - run: pnpm lint:check
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: Unit tests (coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `coverageThreshold` (test/jest-unit.json) fait échouer le job sous le plancher.
      - run: pnpm test:cov
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 14

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Hermétique : env posé par test/e2e/setup-env.ts, ports overridés, aucun I/O réel.
      - run: pnpm test:e2e

  integration:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Docker est disponible sur ubuntu-latest : Postgres/Redis réels,
      # migrations du repo appliquées (un `.sql` cassé échoue ici).
      - run: pnpm test:int

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  gitleaks:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # historique complet : un secret supprimé reste dans git
      # CLI gitleaks (MIT) via son image officielle, pinnée par digest ;
      # `--redact` : aucune valeur détectée ne fuit dans les logs du run.
      - name: Run gitleaks (full history)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git . \
              --redact \
              --no-banner \
              --exit-code 1

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5 # même version qu'en local (infra/README.md)
      - run: terraform fmt -recursive -check -diff
        working-directory: infra
      # Sans backend ni identifiants AWS : vérifie la syntaxe, les types et les
      # références entre modules, avec les providers du lockfile.
      - name: Validate each root module
        working-directory: infra
        run: |
          for root in bootstrap envs/main; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done

  shellcheck:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Script de démarrage de l'instance : s'il casse, l'API ne démarre plus.
      # shellcheck est préinstallé sur les runners Ubuntu.
      - run: shellcheck deploy/voxlivre-boot.sh .github/scripts/deploy.sh

  # --------------------------------------------------------------------------
  # Déploiement continu : chaque push sur master, après TOUS les contrôles.
  # Identifiants AWS temporaires par OIDC (aucune clé dans GitHub) ; le rôle
  # n'accepte que l'environnement `production`, réservé à master.
  # Actions tierces épinglées par SHA de commit : elles manipulent ces
  # identifiants (un tag peut être déplacé, pas un SHA).
  # --------------------------------------------------------------------------
  deploy:
    name: Deploy (production)
    needs: [lint, typecheck, unit, e2e, integration, build, gitleaks, terraform, shellcheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm # natif arm64 (Graviton) : pas d'émulation QEMU
    environment:
      name: production
      url: ${{ vars.API_URL }}
    permissions:
      contents: read
      id-token: write # jeton OIDC pour AWS
    concurrency:
      group: production # partagé avec redeploy.yml : un déploiement à la fois
      cancel-in-progress: false
    env:
      AWS_REGION: eu-west-3
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-3
          mask-aws-account-id: true
      - name: Image name
        id: image
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::$account"
          registry="$account.dkr.ecr.$AWS_REGION.amazonaws.com"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Sans attestations : un index OCI ne serait pas scanné par ECR et ses
      # manifestes enfants non étiquetés seraient exposés au cycle de vie.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.registry }}/voxlivre-api:${{ steps.image.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy
        run: .github/scripts/deploy.sh "${{ steps.image.outputs.tag }}"
